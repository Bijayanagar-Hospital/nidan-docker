# OpenELIS: Lab tests daily summary
# Note: patient_id comes via sample -> sample_human (sample table has no patient_id)
table_name: lab_tests_daily
database: OpenELIS
sql: |
  SELECT
    DATE(a.entry_date) as test_date,
    COALESCE(t.description, 'Unknown') as test_name,
    COUNT(a.id) as test_count,
    COUNT(DISTINCT sh.patient_id) as unique_patients,
    COUNT(CASE WHEN a.status_id IN (SELECT id FROM status_of_sample WHERE name ILIKE '%Final%' AND status_type = 'ANALYSIS') THEN 1 END) as completed_tests,
    COUNT(CASE WHEN a.status_id IN (SELECT id FROM status_of_sample WHERE name ILIKE '%Not Tested%' AND status_type = 'ANALYSIS') THEN 1 END) as pending_tests
  FROM analysis a
  LEFT JOIN test t ON a.test_id = t.id
  LEFT JOIN sample_item si ON a.sampitem_id = si.id
  LEFT JOIN sample s ON si.samp_id = s.id
  LEFT JOIN sample_human sh ON s.id = sh.samp_id
  WHERE a.entry_date >= CURRENT_DATE - INTERVAL '90 days'
  GROUP BY DATE(a.entry_date), COALESCE(t.description, 'Unknown')
  ORDER BY test_date DESC
