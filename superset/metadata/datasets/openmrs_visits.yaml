# OpenMRS: Visits summary by type
table_name: visits_summary
database: OpenMRS
sql: |
  SELECT
    DATE(v.date_started) as visit_date,
    vt.name as visit_type,
    COUNT(DISTINCT v.visit_id) as visit_count,
    COUNT(DISTINCT v.patient_id) as unique_patients,
    AVG(EXTRACT(EPOCH FROM (v.date_stopped - v.date_started)) / 3600) as avg_duration_hours
  FROM visit v
  JOIN visit_type vt ON v.visit_type_id = vt.visit_type_id
  WHERE v.voided = false
    AND v.date_started >= CURRENT_DATE - INTERVAL '90 days'
  GROUP BY DATE(v.date_started), vt.name
  ORDER BY visit_date DESC
