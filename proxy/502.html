<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Unavailable - NidanEHR</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f4f6f8;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        .icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 1.8rem;
            margin-top: 0;
            color: #d32f2f;
        }
        p {
            font-size: 1rem;
            color: #666;
            line-height: 1.5;
            margin-bottom: 30px;
        }
        a {
            display: inline-block;
            background: #1976d2;
            color: white;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 6px;
            font-weight: 500;
            transition: background 0.2s;
        }
        a:hover {
            background: #1565c0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⚠️</div>
        <h1>502 Bad Gateway</h1>
        <p>The requested service is currently offline or restarting. Please wait a few moments and try again.</p>
        <a href="/">Return to Dashboard</a>
    </div>
</body>
</html>
