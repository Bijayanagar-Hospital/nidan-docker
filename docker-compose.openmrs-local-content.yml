# Build OpenMRS backend using LOCAL openmrs-content-referenceapplication-demo
# (includes PostgreSQL liquibase fixes in configuration/liquibase/liquibase.xml)
#
# Usage (from nidan-docker directory):
#   DOCKER_BUILDKIT=1 docker-compose -f docker-compose.yml -f docker-compose.openmrs-local-content.yml build openmrs-backend
#   docker-compose -f docker-compose.yml -f docker-compose.openmrs-local-content.yml up -d openmrs-backend
#
# DOCKER_BUILDKIT=1 enables Maven .m2 cache between builds (faster rebuilds).
# Requires: openmrs-backend and nidan-docker are siblings under same repo root.

services:
  openmrs-backend:
    build:
      context: ..
      dockerfile: nidan-docker/openmrs/Dockerfile.local-content
