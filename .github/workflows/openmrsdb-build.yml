name: OpenMRS DB Build & Push

on:
  workflow_dispatch:

  push:
    branches:
      - dev
      - main
    paths:
      - 'openmrs-db/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v6
        with:
          context: ./openmrs-db
          file: ./openmrs-db/Dockerfile
          push: true
          tags: trigonaltechnology/openmrs-db:latest
