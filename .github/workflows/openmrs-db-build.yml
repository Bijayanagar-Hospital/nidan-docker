name: OpenMRS DB Build & Push

on:
workflow_dispatch:

push:
branches:
- dev
- main
paths:
- 'openmrs-db/**'

pull_request:
branches:
- dev
- main
paths:
- 'openmrs-db/**'

concurrency:
group: openmrs-db-${{ github.ref }}
cancel-in-progress: true

env:
REGISTRY: docker.io
IMAGE_NAME: trigonaltechnology/openmrs-db

jobs:
build-and-push:
runs-on: ubuntu-latest

permissions:
  contents: read
  packages: write

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify repository structure
    run: |
      echo "Repository root:"
      pwd
      echo ""
      echo "Dockerfile:"
      ls -la openmrs-db/
      echo ""
      echo "Backup file:"
      ls -la openmrs-db/db_backup/

  - name: Set up QEMU
    uses: docker/setup-qemu-action@v3

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Log in to Docker Hub
    if: github.event_name != 'pull_request'
    uses: docker/login-action@v3
    with:
      username: ${{ secrets.DOCKERHUB_USERNAME }}
      password: ${{ secrets.DOCKERHUB_TOKEN }}

  - name: Extract metadata
    id: meta
    uses: docker/metadata-action@v5
    with:
      images: ${{ env.IMAGE_NAME }}
      tags: |
        type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
        type=raw,value=stable,enable=${{ github.ref == 'refs/heads/main' }}
        type=sha

  - name: Build and Push Docker image
    uses: docker/build-push-action@v6
    with:
      context: ./openmrs-db
      file: ./openmrs-db/Dockerfile
      platforms: linux/amd64
      push: ${{ github.event_name != 'pull_request' }}
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
      cache-from: type=gha,scope=openmrs-db
      cache-to: type=gha,mode=max,scope=openmrs-db
