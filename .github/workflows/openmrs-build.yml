# OpenMRS Backend Docker Build & Push
# Triggers only on backend-relevant changes (excludes openmrs/frontend/**).
# Frontend has its own workflow (openmrs-frontend-build.yml).

name: OpenMRS Backend Build & Push

on:
  push:
    branches:
      - dev
    paths:
      - 'openmrs/Dockerfile'
      - 'openmrs/pom.xml'
      - 'openmrs/*.sh'
      - 'openmrs/*.jar'
      - 'openmrs/*.java'
      - 'openmrs/*.class'
      - 'openmrs/*.md'
      - 'openmrs/distro/**'
      - 'openmrs/custom_modules/**'
      - 'openmrs/classes/**'
      - 'openmrs/org/**'
      - 'openmrs/scripts/**'
  pull_request:
    branches:
      - dev
    paths:
      - 'openmrs/Dockerfile'
      - 'openmrs/pom.xml'
      - 'openmrs/*.sh'
      - 'openmrs/*.jar'
      - 'openmrs/*.java'
      - 'openmrs/*.class'
      - 'openmrs/*.md'
      - 'openmrs/distro/**'
      - 'openmrs/custom_modules/**'
      - 'openmrs/classes/**'
      - 'openmrs/org/**'
      - 'openmrs/scripts/**'

concurrency:
  group: openmrs-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  IMAGE_BASE: trigonaltechnology

jobs:
  build-and-deploy:
    name: Build & Push openmrs-backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}/openmrs-backend
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: openmrs
          file: openmrs/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=openmrs-backend
          cache-to: type=gha,mode=max,scope=openmrs-backend
